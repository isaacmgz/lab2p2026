#Workflow name
name: CI/CD Pipeline
on:
  #Manually trigger workflow runs
  workflow_dispatch:
  #Trunk-based: main is the trunk, short-lived branches merge into it via PR
  push:
    branches:
      - main
      - 'feature/**'
      - 'docs/**'
  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: lab2p2026

jobs:
  #Test's job
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      #Set up JDK 17 with Maven cache
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run Tests
        run: mvn -B test

  #Sonar's Job
  sonar:
    name: SonarCloud analysis
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          #Full history improves SonarCloud new-code detection
          fetch-depth: 0
      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      #verify runs the tests so JaCoCo produces the coverage report Sonar reads
      - name: Build project
        run: mvn -B clean verify
      #projectKey, organization and host are defined in pom.xml
      - name: SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar -Dsonar.token=$SONAR_TOKEN

  #Build's job
  build:
    needs: sonar
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build with Maven
        run: mvn -B package -DskipTests --file pom.xml
      #Share the JAR with later jobs and keep it after the workflow completes
      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: artifact
          path: target/lab2p2026.jar

  #Docker's job: only publishes images from the trunk
  docker:
    needs: build
    name: Docker build & push
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build & push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            APP_COMMIT=${{ github.sha }}
          tags: |
            docker.io/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            docker.io/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  #Deploy's job: Render pulls the exact image pushed by the docker job
  deploy:
    needs: docker
    name: Deploy to Render
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.RENDER_SERVICE_URL }}
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE: docker.io/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: curl -fsS -X POST --get "$RENDER_DEPLOY_HOOK_URL" --data-urlencode "imgURL=$IMAGE"
      #Render keeps serving the previous instance during rollout, so wait until /commit reports this exact SHA
      - name: Smoke test deployed service
        env:
          SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 30); do
            live_commit=$(curl -fsS --max-time 30 "$SERVICE_URL/commit" || true)
            if [ "$live_commit" = "$EXPECTED_COMMIT" ]; then
              echo "Live commit: $live_commit"
              curl -fsS "$SERVICE_URL/" | grep -q "HEALTH CHECK OK!"
              curl -fsS "$SERVICE_URL/version"
              echo
              exit 0
            fi
            echo "Attempt $attempt: live commit '${live_commit:-none}', waiting for $EXPECTED_COMMIT"
            sleep 20
          done
          echo "Deployed commit never went live" >&2
          exit 1
